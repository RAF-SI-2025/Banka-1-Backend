services:
  # Single Postgres instance — all services share this container, each with its own database
  postgres:
    image: postgres:16
    container_name: banka_postgres
    restart: unless-stopped
    command: postgres -c max_connections=1000
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${DB_EX_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - banka-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RabbitMQ (shared)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: banka_rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - banka-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: banka_redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - banka-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    container_name: banka_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4318"
      - "8889"
    depends_on:
      - jaeger
    networks:
      - banka-network

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: banka_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose:
      - "4317"
    ports:
      - "16686:16686"
    networks:
      - banka-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: banka_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - banka-network

  loki:
    image: grafana/loki:3.1.1
    container_name: banka_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - banka-network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: banka_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - notification-service-logs:/var/log/services/notification:ro
      - employee-service-logs:/var/log/services/employee:ro
      - client-service-logs:/var/log/services/client:ro
      - banking-service-logs:/var/log/services/banking:ro
      - exchange-service-logs:/var/log/services/exchange:ro
      - verification-service-logs:/var/log/services/verification:ro
      - order-service-logs:/var/log/services/order:ro
      - stock-service-logs:/var/log/services/stock:ro
    depends_on:
      - loki
    networks:
      - banka-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: banka_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - banka-network

  # Notification Service
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      args:
        SERVER_PORT: ${NOTIFICATION_SERVER_PORT:-8006}
    container_name: notification-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NOTIFICATION_SERVICE_HOST: ${NOTIFICATION_SERVICE_HOST:-0.0.0.0}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVER_PORT:-8006}
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT:-8006}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: notification-service
      LOGGING_FILE_PATH: /var/log/banka
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${NOTIFICATION_SERVER_PORT:-8006}"
    networks:
      - banka-network
    volumes:
      - notification-service-logs:/var/log/banka
      - ./banka-1-firebase-firebase-adminsdk-fbsvc-e306452a8c.json:/app/firebase-credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${NOTIFICATION_SERVER_PORT:-8006}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Employee Service
  employee-service:
    build:
      context: ..
      dockerfile: employee-service/Dockerfile
      args:
        SERVER_PORT: ${USER_SERVER_PORT:-8081}
    container_name: banka_employee_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-banka}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBIT_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBIT_PORT: ${RABBITMQ_PORT:-5672}
      SERVER_PORT: ${USER_SERVER_PORT:-8081}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: employeeService
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${USER_SERVER_PORT:-8081}"
    networks:
      - banka-network
    volumes:
      - employee-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${USER_SERVER_PORT:-8081}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Client Service
  client-service:
    build:
      context: ..
      dockerfile: client-service/Dockerfile
      args:
        SERVER_PORT: ${CLIENT_SERVER_PORT:-8083}
    container_name: banka_client_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLIENT_SERVICE_DB_HOST: postgres
      CLIENT_SERVICE_PORT: ${CLIENT_SERVER_PORT:-8083}
      SERVER_PORT: ${CLIENT_SERVER_PORT:-8083}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: clientService
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${CLIENT_SERVER_PORT:-8083}"
    networks:
      - banka-network
    volumes:
      - client-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CLIENT_SERVER_PORT:-8083}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Banking Service — consolidates account, card, credit, transaction, transfer
  banking-service:
    build:
      context: ..
      dockerfile: banking-service/Dockerfile
      args:
        SERVER_PORT: ${BANKING_SERVER_PORT:-8084}
    container_name: banka_banking_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BANKING_SERVER_PORT: ${BANKING_SERVER_PORT:-8084}
      SERVER_PORT: ${BANKING_SERVER_PORT:-8084}
      BANKING_DB_HOST: postgres
      BANKING_DB_PORT: ${BANKING_DB_PORT:-5432}
      BANKING_DB_NAME: ${BANKING_DB_NAME:-bankingdb}
      BANKING_DB_USER: ${BANKING_DB_USER:-postgres}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_USER_URL: ${SERVICES_USER_URL:-http://client-service:8083}
      SERVICES_CLIENT_URL: ${SERVICES_CLIENT_URL:-http://client-service:8083}
      SERVICES_ACCOUNT_URL: ${SERVICES_ACCOUNT_URL:-http://banking-service:8084}
      SERVICES_CARD_URL: ${SERVICES_CARD_URL:-http://banking-service:8084}
      SERVICES_EXCHANGE_URL: ${SERVICES_EXCHANGE_URL:-http://exchange-service:8085}
      SERVICES_VERIFICATION_URL: http://verification-service:${VERIFICATION_SERVER_PORT:-8086}
      SKIP_VERIFICATION: ${SKIP_VERIFICATION:-false}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-service-queue}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-employee.events}
      NOTIFICATION_ROUTING_KEY: ${NOTIFICATION_ROUTING_KEY:-employee.#}
      NOTIFICATION_RABBIT_EXCHANGE: ${NOTIFICATION_EXCHANGE:-employee.events}
      CARD_RABBIT_AUTO_EXCHANGE: ${NOTIFICATION_EXCHANGE:-employee.events}
      CARD_RABBIT_AUTO_QUEUE: ${CARD_RABBIT_AUTO_QUEUE:-card-service-auto-card-queue}
      CARD_RABBIT_AUTO_ROUTING_KEY: ${CARD_RABBIT_AUTO_ROUTING_KEY:-card.create}
      CARD_CREATION_AUTOMATIC_DEFAULT_LIMIT: ${CARD_CREATION_AUTOMATIC_DEFAULT_LIMIT:-1000000}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: banking-service
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${BANKING_SERVER_PORT:-8084}"
    networks:
      - banka-network
    volumes:
      - banking-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BANKING_SERVER_PORT:-8084}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Exchange Service
  exchange-service:
    build:
      context: ..
      dockerfile: exchange-service/Dockerfile
      args:
        SERVER_PORT: ${EXCHANGE_SERVER_PORT:-8085}
    container_name: exchange-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EXCHANGE_SERVICE_HOST: 0.0.0.0
      EXCHANGE_SERVER_PORT: ${EXCHANGE_SERVER_PORT:-8085}
      EXCHANGE_DB_HOST: postgres
      EXCHANGE_DB_PORT: 5432
      EXCHANGE_DB_NAME: ${EXCHANGE_DB_NAME:-exchange_db}
      EXCHANGE_DB_USER: ${EXCHANGE_DB_USER:-postgres}
      EXCHANGE_DB_PASSWORD: ${EXCHANGE_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: exchange-service
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${EXCHANGE_SERVER_PORT:-8085}"
    networks:
      - banka-network
    volumes:
      - exchange-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${EXCHANGE_SERVER_PORT:-8085}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Stock Service
  stock-service:
    build:
      context: ..
      dockerfile: stock-service/Dockerfile
      args:
        SERVER_PORT: ${STOCK_SERVICE_PORT:-8090}
    container_name: banka_stock_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STOCK_SERVICE_HOST: 0.0.0.0
      STOCK_SERVICE_PORT: ${STOCK_SERVICE_PORT:-8090}
      STOCK_DB_HOST: postgres
      STOCK_DB_PORT: 5432
      STOCK_DB_NAME: ${STOCK_DB_NAME:-stock_db}
      STOCK_DB_USER: ${STOCK_DB_USER:-postgres}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      STOCK_EXCHANGE_SERVICE_URL: http://exchange-service:${EXCHANGE_SERVER_PORT:-8085}
      STOCK_MARKET_DATA_BASE_URL: ${STOCK_MARKET_DATA_BASE_URL:-https://www.alphavantage.co}
      STOCK_MARKET_DATA_API_KEY: ${STOCK_MARKET_DATA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: stock-service
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${STOCK_SERVICE_PORT:-8090}"
    networks:
      - banka-network
    volumes:
      - stock-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${STOCK_SERVICE_PORT:-8090}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Verification Service
  verification-service:
    build:
      context: ..
      dockerfile: verification-service/Dockerfile
      args:
        SERVER_PORT: ${VERIFICATION_SERVER_PORT:-8086}
    container_name: banka_verification_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VERIFICATION_SERVER_PORT: ${VERIFICATION_SERVER_PORT:-8086}
      VERIFICATION_DB_HOST: postgres
      VERIFICATION_DB_PORT: 5432
      VERIFICATION_DB_NAME: ${VERIFICATION_DB_NAME:-verificationdb}
      VERIFICATION_DB_USER: ${VERIFICATION_DB_USER:-postgres}
      VERIFICATION_DB_PASSWORD: ${VERIFICATION_DB_PASSWORD:-postgres}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-service-queue}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-employee.events}
      NOTIFICATION_ROUTING_KEY: ${NOTIFICATION_ROUTING_KEY:-employee.#}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: verificationService
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${VERIFICATION_SERVER_PORT:-8086}"
    networks:
      - banka-network
    volumes:
      - verification-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${VERIFICATION_SERVER_PORT:-8086}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Order Service
  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
      args:
        SERVER_PORT: ${ORDER_SERVER_PORT:-8088}
    container_name: banka_order_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORDER_SERVER_PORT: ${ORDER_SERVER_PORT:-8088}
      ORDER_DB_HOST: postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orderdb}
      ORDER_DB_USER: ${ORDER_DB_USER:-postgres}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-service-queue}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-employee.events}
      NOTIFICATION_ROUTING_KEY: ${NOTIFICATION_ROUTING_KEY:-employee.#}
      ACCOUNT_SERVICE_HOST: banking-service
      ACCOUNT_SERVER_PORT: ${BANKING_SERVER_PORT:-8084}
      EMPLOYEE_SERVICE_HOST: employee-service
      USER_SERVER_PORT: ${USER_SERVER_PORT:-8081}
      CLIENT_SERVICE_HOST: client-service
      CLIENT_SERVER_PORT: ${CLIENT_SERVER_PORT:-8083}
      EXCHANGE_SERVICE_HOST: exchange-service
      EXCHANGE_SERVER_PORT: ${EXCHANGE_SERVER_PORT:-8085}
      STOCK_SERVICE_HOST: stock-service
      STOCK_SERVICE_PORT: ${STOCK_SERVICE_PORT:-8090}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_SERVICE_NAME: order-service
      LOGGING_FILE_PATH: /var/log/banka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "${ORDER_SERVER_PORT:-8088}"
    networks:
      - banka-network
    volumes:
      - order-service-logs:/var/log/banka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ORDER_SERVER_PORT:-8088}/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Investment Fund Service
  investment-fund-service:
    build:
      context: ..
      dockerfile: investment-fund-service/Dockerfile
      args:
        SERVER_PORT: ${INVESTMENT_FUND_SERVICE_PORT:-8092}
    container_name: banka_investment_fund_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${INVESTMENT_FUND_SERVICE_PORT:-8092}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${INVESTMENT_FUND_DB_NAME:-investment_fund_db}
      DB_USER: ${INVESTMENT_FUND_DB_USER:-postgres}
      DB_PASSWORD: ${INVESTMENT_FUND_DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      BANKING_SERVICE_URL: http://banking-service:${BANKING_SERVER_PORT:-8084}
      EMPLOYEE_SERVICE_URL: http://employee-service:${USER_SERVER_PORT:-8081}
      ORDER_SERVICE_URL: http://order-service:${ORDER_SERVER_PORT:-8088}
      ROOT_PATH: /funds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${INVESTMENT_FUND_SERVICE_PORT:-8092}"
    networks:
      - banka-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${INVESTMENT_FUND_SERVICE_PORT:-8092}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: banka_api_gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-80}:80"
    env_file:
      - .env
    environment:
      SERVER_PORT: ${USER_SERVER_PORT:-8081}
      CLIENT_SERVICE_PORT: ${CLIENT_SERVER_PORT:-8083}
      BANKING_SERVICE_PORT: ${BANKING_SERVER_PORT:-8084}
      EXCHANGE_SERVER_PORT: ${EXCHANGE_SERVER_PORT:-8085}
      VERIFICATION_SERVER_PORT: ${VERIFICATION_SERVER_PORT:-8086}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVER_PORT:-8006}
      ORDER_SERVER_PORT: ${ORDER_SERVER_PORT:-8088}
      STOCK_SERVICE_PORT: ${STOCK_SERVICE_PORT:-8090}
      INVESTMENT_FUND_SERVICE_PORT: ${INVESTMENT_FUND_SERVICE_PORT:-8092}
    depends_on:
      employee-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      banking-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      investment-fund-service:
        condition: service_healthy
    networks:
      - banka-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/gateway-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  banka-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  loki-data:
  notification-service-logs:
  employee-service-logs:
  client-service-logs:
  banking-service-logs:
  exchange-service-logs:
  verification-service-logs:
  order-service-logs:
  stock-service-logs:

